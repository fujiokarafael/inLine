{% extends "base.html" %} {% load static %} {% block content %}
<div
  class="bg-slate-50 min-h-screen flex flex-col p-4 overflow-hidden relative"
>
  <header class="flex justify-between items-center mb-6 px-4">
    <div class="flex items-center gap-5">
      <a
        href="{% url 'dashboard-central' %}"
        class="bg-white text-slate-500 p-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition-all shadow-sm border border-slate-200 flex items-center justify-center"
        title="Voltar ao Painel"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          />
        </svg>
      </a>

      <div>
        <h1
          class="text-slate-900 text-2xl font-black uppercase tracking-widest leading-none"
        >
          Painel de Produção
        </h1>
        <p
          class="text-blue-600 text-[10px] font-black uppercase tracking-tighter mt-1"
        >
          Fila por Estação de Prato
        </p>
      </div>
    </div>

    <div
      id="status-conexao"
      class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-4"
    >
      <button
        onclick="toggleModoEdicao()"
        id="btn-modo-edicao"
        class="bg-white border border-slate-200 text-slate-600 px-6 py-3 rounded-2xl text-xs font-black shadow-sm hover:bg-slate-50 transition-all uppercase tracking-widest"
      >
        Editar Cardápio
      </button>
      <span>Sistema Online</span>
    </div>
  </header>

  <main
    id="painel-estacoes"
    class="flex-1 flex gap-6 overflow-x-auto pb-8 items-start px-4 custom-scrollbar"
  >
    <div
      class="w-full text-center py-20 text-slate-400 animate-pulse font-bold uppercase tracking-widest text-sm"
    >
      Sincronizando pratos...
    </div>
  </main>

  <div
    id="modal-edicao"
    class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
  >
    <div
      class="bg-white rounded-[2rem] w-full max-w-md p-6 shadow-2xl animate-card"
    >
      <h2
        class="text-xl font-black text-slate-900 uppercase tracking-widest mb-6"
      >
        Editar Prato
      </h2>
      <input type="hidden" id="edit-id" />

      <div class="space-y-4">
        <div>
          <label
            class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1"
            >Nome do Prato</label
          >
          <input
            type="text"
            id="edit-nome"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 outline-none focus:border-blue-500"
          />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label
              class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1"
              >Preço (R$)</label
            >
            <input
              type="number"
              step="0.01"
              id="edit-preco"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 outline-none focus:border-blue-500"
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1"
              >Estoque Atual</label
            >
            <input
              type="number"
              id="edit-estoque"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 outline-none focus:border-blue-500"
            />
          </div>
        </div>
      </div>

      <div class="mt-8 flex gap-3">
        <button
          onclick="fecharModal()"
          class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-black text-xs uppercase tracking-widest transition-all"
        >
          Cancelar
        </button>
        <button
          onclick="salvarEdicao()"
          class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-black text-xs uppercase tracking-widest transition-all shadow-lg shadow-blue-200"
        >
          Salvar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    height: 8px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: #f1f5f9;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  .animate-card {
    animation: none; /* Desativado para evitar que pisque a cada refresh */
  }

  /* Se quiser animação, aplique apenas em novos itens via JS */
  .card-novo {
    animation: slideUp 0.3s ease-out forwards;
  }
  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
{% endblock %} {% block extra_js %}
<script src="{% static 'js/producao.js' %}"></script>
{% endblock %}
